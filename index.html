<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, location.pathname.slice(0, -1) + decoded + location.hash)
        }
      })(window.location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24344d" />
    <meta name="description" content="Invitación digital — Juan Carlos & Jessica" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Juan Carlos & Jessica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
